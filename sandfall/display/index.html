<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sand Emotions · Class wall</title>
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="../icons/favicon-64.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<link rel="stylesheet" href="../wall.css?v=2026-11-04b">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="../../config.js"></script>
<script src="../engine.js?v=2026-11-04b"></script>
<script src="../cubbies.js?v=2026-11-04b"></script>
</head>
<body data-wall="display">

<div class="app">
  <header class="top">
    <div class="mark">
      <h1>Sand Emotions <span class="beta">Class wall</span></h1>
      <p>The class colab and everyone’s cubbies, live.</p>
      <p class="notice" id="notice" hidden></p>
    </div>
    <div class="tools">
      <span class="status" id="status"><span class="dot"></span><span id="statusText">Connecting…</span></span>
      <button class="btn" id="fs" type="button">Full screen</button>
      <span class="build" title="Version of this page">v8 · build 2026-11-04b</span>
    </div>
  </header>
  <main class="wall" id="wall">
    <section class="class-mix" id="classMixBox" aria-label="Class emotions">
      <p class="cap">Class emotions</p>
      <div class="class-box" id="classBox"><canvas id="classMix" aria-hidden="true"></canvas></div>
    </section>
    <div class="stage" id="stage">
      <div class="stage-row" id="stageRow">
        <section class="colab" aria-label="Class colab">
          <p class="cap" id="colabCap">Class colab</p>
          <div id="colabTile"></div>
        </section>
        <div class="grid" id="grid" aria-label="Student cubbies"></div>
        <p class="empty-note" id="empty" hidden></p>
      </div>
    </div>
  </main>
  <div class="hover-name" id="hoverName" hidden><canvas class="face" id="hoverFace" width="56" height="56" aria-hidden="true"></canvas><span id="hoverText"></span></div>
</div>

<script src="../wall.js?v=2026-11-04b"></script>
</body>
</html>
