<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Cat Emotions · Teacher</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=JetBrains+Mono:wght@500&display=swap">
<link rel="stylesheet" href="../wall.css?v=2026-10-28c">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="../../config.js"></script>
<script src="../engine.js?v=2026-10-28c"></script>
<script src="../cubbies.js?v=2026-10-28c"></script>
</head>
<body data-wall="admin">

<div class="app">
  <header class="top">
    <div class="mark">
      <h1>Cat Emotions <span class="beta">teacher</span></h1>
      <p>Everyone’s cubbies, live. Tap a cubby to remove it, or the colab to start it fresh.</p>
      <p class="notice" id="notice" hidden></p>
    </div>
    <div class="tools">
      <span class="status" id="status"><span class="dot"></span><span id="statusText">Connecting…</span></span>
      <button class="btn" id="fs" type="button">Full screen</button>
      <span class="build" title="Version of this page">v7 · build 2026-10-28c</span>
    </div>
  </header>
  <main class="wall" id="wall">
    <div class="stage" id="stage">
      <div class="stage-row" id="stageRow">
        <section class="colab" aria-label="Class colab">
          <p class="cap" id="colabCap">Class colab</p>
          <div id="colabTile"></div>
        </section>
        <div class="grid" id="grid" aria-label="Student cubbies"></div>
        <p class="empty-note" id="empty" hidden></p>
      </div>
    </div>
    <aside class="class-mix" id="classMixBox" aria-label="Cats the whole class has used">
      <p class="cap">Whole class</p>
      <div class="class-box" id="classBox"><canvas id="classMix" aria-hidden="true"></canvas></div>
    </aside>
  </main>
</div>

<div class="dialog-back" id="ask" hidden>
  <div class="dialog" role="alertdialog" aria-modal="true" aria-labelledby="askTitle" aria-describedby="askText">
    <h2 id="askTitle"></h2>
    <canvas id="preview" width="480" height="300"></canvas>
    <p id="askText"></p>
    <div class="row">
      <button class="btn big" id="cancel" type="button">Cancel</button>
      <button class="btn big danger" id="remove" type="button">Remove</button>
    </div>
  </div>
</div>

<script src="../wall.js?v=2026-10-28c"></script>
</body>
</html>
